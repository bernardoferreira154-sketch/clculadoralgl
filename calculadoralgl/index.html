<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <script src="script.js" defer></script>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <label>Primeiro Numero</label>
        <input type="text" id="numb1" placeholder="digite o primeiro numero">

        <label>Segundo Numero</label>
        <input type="text" id="numb2" placeholder="digite o segundo numero">

        <div class="sinais">

            <button class="btn" data-operador="+">+</button>

            <button class="btn" data-operador="-">-</button>

            <button class="btn" data-operador="*">×</button>

            <button class="btn" data-operador="/">÷</button>

        </div>

        <div class="resultado" id="resultado">
        </div>

    </div>

</body>

</html>
